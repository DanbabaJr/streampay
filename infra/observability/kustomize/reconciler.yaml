apiVersion: apps/v1
kind: Deployment
metadata:
  name: streampay-reconciler
  namespace: streampay-observability
  labels:
    app: streampay-reconciler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streampay-reconciler
  template:
    metadata:
      labels:
        app: streampay-reconciler
    spec:
      containers:
        - name: reconciler
          image: streampay/reconciler:latest
          ports:
            - containerPort: 9091
              name: metrics
          env:
            - name: PORT
              value: "9091"
            - name: SWEEP_INTERVAL_MS
              value: "60000"
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reconciler-service
  namespace: streampay-observability
spec:
  selector:
    app: streampay-reconciler
  ports:
    - protocol: TCP
      port: 9091
      targetPort: 9091
      name: http-metrics
