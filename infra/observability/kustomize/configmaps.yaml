apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: streampay-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/rules/*.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']
    scrape_configs:
      - job_name: 'streampay-indexer'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['indexer-service:9090']
      - job_name: 'streampay-reconciler'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['reconciler-service:9091']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: streampay-observability
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'service', 'severity']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      receiver: 'default-webhook'
    receivers:
      - name: 'default-webhook'
        webhook_configs:
          - url: 'http://localhost:5001/alerts'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: streampay-observability
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
