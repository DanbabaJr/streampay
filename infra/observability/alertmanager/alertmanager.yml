# Alertmanager configuration for StreamPay observability stack
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: 'default-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'p0-pager-webhook'
      repeat_interval: 30m

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  - name: 'p0-pager-webhook'
    webhook_configs:
      - url: 'http://localhost:5001/p0-alerts'
        send_resolved: true

inhibit_rules:
  # Inhibit warning alert if critical alert is already firing for same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service', 'component']
