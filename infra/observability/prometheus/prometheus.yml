# Prometheus configuration for StreamPay observability stack
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s
  external_labels:
    environment: 'testnet'
    project: 'streampay'

rule_files:
  - 'rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'streampay-indexer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['indexer:9090']
        labels:
          service: 'indexer'

  - job_name: 'streampay-reconciler'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['reconciler:9091']
        labels:
          service: 'reconciler'

  - job_name: 'otel-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'otel-collector'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
