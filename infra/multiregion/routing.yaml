# Health-based read routing across the active-active regions.
#
# Each region Service only ever contains Ready endpoints (the per-region
# readiness probes above gate membership), so an unready or failed region is
# removed from the route by the data plane rather than by a health check this
# manifest would have to duplicate. Within the application, freshness-based
# routing (`indexer/src/multiregion/router.ts`) skips a region whose ledger
# watermark is more than READ_FRESHNESS_MAX_LAG_LEDGERS behind the tip and fails
# closed when no region is fresh enough.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: streampay-indexer-read
  namespace: streampay
  labels:
    app.kubernetes.io/name: streampay-indexer
    app.kubernetes.io/component: read-routing
spec:
  parentRefs:
    - name: streampay-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: streampay-indexer-us-east
          port: 9090
        - name: streampay-indexer-eu-west
          port: 9090
        - name: streampay-indexer-ap-south
          port: 9090
---
# Pull-based discovery of the regions' read endpoints, for clients that route
# themselves (the SDK / frontend can pick the freshest region from this list).
apiVersion: v1
kind: ConfigMap
metadata:
  name: streampay-indexer-regions
  namespace: streampay
  labels:
    app.kubernetes.io/name: streampay-indexer
    app.kubernetes.io/component: read-routing
data:
  regions.json: |
    [
      { "id": "us-east", "endpoint": "http://streampay-indexer-us-east.streampay.svc:9090", "priority": 1 },
      { "id": "eu-west", "endpoint": "http://streampay-indexer-eu-west.streampay.svc:9090", "priority": 2 },
      { "id": "ap-south", "endpoint": "http://streampay-indexer-ap-south.streampay.svc:9090", "priority": 3 }
    ]
