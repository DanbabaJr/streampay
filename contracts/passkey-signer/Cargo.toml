[package]
name = "streampay-passkey"
version = "0.1.0"
edition = "2021"
description = "StreamPay passkey signer: WebAuthn / CBOR assertion verification for non-custodial stream claims on Soroban."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
