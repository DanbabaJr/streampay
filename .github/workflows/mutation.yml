name: Mutation Testing

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutation:
    name: Contract — cargo-mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run mutation testing
        working-directory: contracts/streaming-payments
        run: cargo mutants --output mutants.out

      - name: Extract mutation summary
        run: |
          cd contracts/streaming-payments
          echo "Mutation testing summary:"
          tail -1 mutants.out/log/baseline.log || true
          cat mutants.out/missed.txt || echo "No missed mutants"
          cat mutants.out/caught.txt | wc -l || echo "0 caught mutants"

      - name: Upload mutation results
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: contracts/streaming-payments/mutants.out/
          retention-days: 30

      - name: Check kill rate threshold
        run: |
          cd contracts/streaming-payments
          caught=$(cat mutants.out/caught.txt | wc -l)
          missed=$(cat mutants.out/missed.txt | wc -l)
          total=$((caught + missed))
          kill_rate=$(echo "scale=1; $caught * 100 / $total" | bc)
          echo "Kill rate: $kill_rate% ($caught/$total)"
          if (( $(echo "$kill_rate < 90" | bc -l) )); then
            echo "Kill rate below 90% threshold"
            exit 1
          fi

      - name: Comment on issue with results
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const missedPath = 'contracts/streaming-payments/mutants.out/missed.txt';
            const caughtPath = 'contracts/streaming-payments/mutants.out/caught.txt';

            let missed = [];
            let caught = 0;

            if (fs.existsSync(missedPath)) {
              missed = fs.readFileSync(missedPath, 'utf8').trim().split('\n');
            }
            if (fs.existsSync(caughtPath)) {
              caught = fs.readFileSync(caughtPath, 'utf8').trim().split('\n').length;
            }

            const total = caught + missed.length;
            const killRate = total > 0 ? ((caught / total) * 100).toFixed(1) : 0;

            const body = `## Mutation Testing Results

**Kill Rate:** ${killRate}% (${caught}/${total} caught)

### Missed Mutants (${missed.length})

${missed.length > 0 ? missed.map(m => `- \`${m}\``).join('\n') : 'None'}

*Generated by cargo-mutants on ${new Date().toISOString()}*`;

            // Find or create an issue for mutation testing results
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'mutation-testing'
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Mutation Testing Results',
                body: body,
                labels: ['mutation-testing']
              });
            }
