name: Fuzz

# Coverage-guided fuzzing of the pure accrual and dispute-bond math.
# Scheduled and manual only; `continue-on-error` keeps a found crash from
# blocking unrelated PRs — crashes must become regression tests (see
# docs/GOOD_FIRST_ISSUES.md #4).
# Coverage-guided fuzzing of the pure accrual math, single-window and segmented. Scheduled and manual only;
# `continue-on-error` keeps a found crash from blocking unrelated PRs — crashes
# must become regression tests (see docs/GOOD_FIRST_ISSUES.md #4).

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays ~03:17 UTC
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Fuzzing budget per target, seconds"
        required: false
        default: "120"

permissions:
  contents: read

jobs:
  streamed_at:
    name: fuzz streamed_at
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz

      - name: Run fuzz session
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run streamed_at -- \
            -max_total_time=${{ github.event.inputs.max_total_time || '60' }} \
            -rss_limit_mb=4096

  dispute_bond:
    name: fuzz dispute_bond
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz

      - name: Run dispute bond fuzz session
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run dispute_bond -- \
            -max_total_time=${{ github.event.inputs.max_total_time || '60' }} \
            -rss_limit_mb=4096

  conservation:
    name: fuzz conservation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz

      - name: Run conservation fuzz session
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run conservation -- \
            -max_total_time=${{ github.event.inputs.max_total_time || '60' }} \
            -rss_limit_mb=4096
  rate_schedule:
    name: fuzz rate_schedule
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz

      - name: Run piecewise accrual fuzz session
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run rate_schedule --             -max_total_time=${{ github.event.inputs.max_total_time || '60' }}             -rss_limit_mb=4096
