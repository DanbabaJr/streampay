name: Secrets rotation

# Issue #615. The indexer rotates webhook signing keys and RPC credentials with a
# bounded overlap window, a fail-safe abort and a hash-chained audit log. This
# workflow is the scheduled half of that pipeline:
#
#   1. rotation-tests — the overlap/abort/audit/hot-reload suites, on every
#      change to the rotation surface (so a regression is caught on the PR, not
#      at 04:43 on some Tuesday) and on a nightly schedule;
#   2. drill — a daily simulated rotation under continuous load, with its JUnit
#      report kept as the audit evidence that the drill actually ran.
#
# It does not touch production secrets: there is no credential here to rotate.
# The drill uses the in-memory provider, so what it proves is the lifecycle, not
# that a particular provider worked today.

on:
  schedule:
    # Daily, off the hour to avoid the cron thundering herd.
    - cron: "43 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "indexer/src/secrets/**"
      - "indexer/src/webhooks/**"
      - "indexer/src/rpc-manager.ts"
      - "indexer/src/rpc-credentials.test.ts"
      - "infra/secrets-rotation/**"
      - ".github/workflows/secrets-rotation.yml"
  pull_request:
    paths:
      - "indexer/src/secrets/**"
      - "indexer/src/webhooks/**"
      - "indexer/src/rpc-manager.ts"
      - "indexer/src/rpc-credentials.test.ts"
      - "infra/secrets-rotation/**"
      - ".github/workflows/secrets-rotation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rotation-tests:
    name: Rotation — overlap / abort / audit / hot reload
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The two suites that own this feature. Kept as their own step so a
      # rotation regression names itself instead of hiding inside the full
      # indexer run.
      - name: Overlap window, fail-safe abort, audit integrity, hot reload
        run: node --test dist/secrets/rotation.test.js dist/rpc-credentials.test.js

      # Parse-check the documented policy: it is read by operators and by the
      # deploy, so a stray comma must fail here rather than at 03:00.
      - name: Rotation policy is valid JSON
        working-directory: ${{ github.workspace }}
        run: |
          node -e "const p=require('./infra/secrets-rotation/rotation-policy.json');
            for (const name of ['webhook_signing_keys','rpc_credentials']) {
              if (!p.secrets[name]) { throw new Error('policy is missing ' + name); }
            }
            if (p.secrets.webhook_signing_keys.overlap_seconds < 60) {
              throw new Error('webhook overlap below 60s is an outage, not a rotation');
            }
            console.log('rotation policy OK');"

  drill:
    name: Drill — rotate under load and archive the audit evidence
    runs-on: ubuntu-latest
    needs: rotation-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      # Same chaos test the PR gate runs, but with a JUnit report: the artifact
      # is the evidence that the drill ran and what it observed. A drill whose
      # result nobody kept is indistinguishable from one that never happened.
      - name: Rotation-under-load drill (JUnit report)
        run: |
          mkdir -p ../logs
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=../logs/rotation-drill.xml \
            dist/secrets/rotation.test.js dist/rpc-credentials.test.js

      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secrets-rotation-drill-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 90
