name: Nightly Differential Fuzz

on:
  schedule:
    - cron: "0 2 * * *" # Every night at 02:00 UTC
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Fuzzing budget per target, seconds"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  differential_fuzz:
    name: Differential Fuzz (Wasm vs Reference Model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz

      - name: Run differential fuzz session
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run differential -- \
            -max_total_time=${{ github.event.inputs.max_total_time || '300' }} \
            -rss_limit_mb=4096

      - name: Persist failing seeds / crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: differential-fuzz-artifacts
          path: |
            fuzz/artifacts/differential/
            fuzz/corpus/differential/
          if-no-files-found: ignore

  conservation_fuzz:
    name: Value Conservation Fuzz (Multi-Token State Machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz

      - name: Run conservation fuzz session
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run conservation -- \
            -max_total_time=${{ github.event.inputs.max_total_time || '1800' }} \
            -rss_limit_mb=4096

      - name: Persist failing seeds / crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conservation-fuzz-artifacts
          path: |
            fuzz/artifacts/conservation/
            fuzz/corpus/conservation/
          if-no-files-found: ignore
  rate_schedule_fuzz:
    name: Piecewise Accrual Fuzz (renegotiated schedules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz

      - name: Run rate_schedule fuzz session
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run rate_schedule --             -max_total_time=${{ github.event.inputs.max_total_time || '300' }}             -rss_limit_mb=4096

      - name: Persist failing seeds / crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rate-schedule-fuzz-artifacts
          path: |
            fuzz/artifacts/rate_schedule/
            fuzz/corpus/rate_schedule/
          if-no-files-found: ignore
