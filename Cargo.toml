[workspace]
resolver = "2"
members = [
    "contracts/streaming-payments",
    "contracts/passkey-signer",
    "contracts/vault",
    "model",
    "tools/streampay-state",
]
# The fuzz harness is its own workspace (cargo-fuzz needs nightly-only
# settings that must not leak into the contract build).
exclude = [
    "fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
soroban-sdk = "29"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
